# Production reverse proxy — HTTPS via Certbot, HSTS, redirect www→non-www and http→https.
# Admin static SPA is served by the `admin` container (Nginx on :8080).

upstream web_upstream   { server web:3000; }
upstream admin_upstream { server admin:8080; }
upstream api_upstream   { server api:3001; }

# http → https + ACME challenge
server {
    listen 80;
    server_name filtervoda.mk www.filtervoda.mk;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://filtervoda.mk$request_uri; }
}

# www → non-www (https)
server {
    listen 443 ssl;
    http2 on;
    server_name www.filtervoda.mk;
    ssl_certificate     /etc/letsencrypt/live/filtervoda.mk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filtervoda.mk/privkey.pem;
    return 301 https://filtervoda.mk$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name filtervoda.mk;

    ssl_certificate     /etc/letsencrypt/live/filtervoda.mk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filtervoda.mk/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP allows GTM/GA/Meta Pixel/Turnstile + self-hosted fonts (marketing site with consented tags).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://*.facebook.com; frame-src https://challenges.cloudflare.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://admin_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
