# Staging reverse proxy — HTTPS + HTTP basic auth + noindex (ADR-004). Same topology as prod
# on staging.filtervoda.mk. Create the htpasswd file on the host: /etc/nginx/.htpasswd

upstream web_upstream   { server web:3000; }
upstream admin_upstream { server admin:8080; }
upstream api_upstream   { server api:3001; }

server {
    listen 80;
    server_name staging.filtervoda.mk;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://staging.filtervoda.mk$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.filtervoda.mk;

    ssl_certificate     /etc/letsencrypt/live/staging.filtervoda.mk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.filtervoda.mk/privkey.pem;

    # Keep staging out of search + behind basic auth.
    add_header X-Robots-Tag "noindex, nofollow" always;
    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 8m;

    location /api/   { proxy_pass http://api_upstream;   proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /admin/ { proxy_pass http://admin_upstream; proxy_set_header Host $host; }
    location /       { proxy_pass http://web_upstream;   proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
