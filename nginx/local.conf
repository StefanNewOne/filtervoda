# Local reverse proxy — routes the whole stack under http://localhost
# Mirrors the production topology (CLAUDE.md §12.5). Prod adds TLS via Certbot.
#
# Uses the Docker embedded DNS (127.0.0.11) with variable proxy_pass so Nginx re-resolves
# upstream IPs per request — otherwise a recreated web/admin/api container (new IP) causes 502.

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 8m; # media uploads (re-encoded server-side)

    # Security headers on all responses (mirrors production; no HSTS on local HTTP).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.facebook.com; frame-src https://challenges.cloudflare.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # API
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA (Vite dev server) behind /admin/
    location /admin/ {
        set $admin_upstream http://admin:5173;
        proxy_pass $admin_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # Vite HMR websocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    # Public storefront (React Router 7 SSR) — everything else
    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
