# Production stack. TLS terminates at Caddy with automatic Let's Encrypt (like the sister
# potencijashop project) — no host Certbot. `scripts/deploy-vps.sh` ships + builds this file
# on the VPS. Secrets come from .env.production. SITE_DOMAIN can be a real domain or the
# 135.181.156.104.sslip.io preview host (valid TLS without DNS).
name: filtervoda-prod

services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://api:3001
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    restart: always

  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    restart: always

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/v1/health']
      interval: 20s
      timeout: 5s
      retries: 5
    restart: always

  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  caddy:
    image: caddy:2-alpine
    depends_on: [web, admin, api]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddydata:/data # issued TLS certs persist here
      - caddyconfig:/config
    restart: always

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
