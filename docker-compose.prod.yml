# Production stack. TLS terminates at the host Nginx (Certbot); this compose runs the apps +
# datastores. `scripts/deploy.sh` builds and starts this file. Secrets come from .env.production.
name: filtervoda-prod

services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://api:3001
    depends_on: [api]
    restart: always

  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    restart: always

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/v1/health']
      interval: 20s
      timeout: 5s
      retries: 5
    restart: always

  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:alpine
    depends_on: [web, admin, api]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # Certbot certs from the host
      - certbot-webroot:/var/www/certbot
    restart: always

volumes:
  pgdata:
  redisdata:
  certbot-webroot:
